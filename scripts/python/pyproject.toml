[project]
name = "school-scripts"
version = "0.1.0"
description = "Python scripts for School OS"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.53.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]
